<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sahaay - Smart Resource Allocation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Immediate Theme Initializer to prevent flash -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('sahaay-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-theme');
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('dark', 'dark-theme');
          });
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- Stitch Design Tokens: Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    /* Material Symbols Rounded - Base variant */
    .material-symbols-rounded, .mat-icon[fontSet="material-symbols-rounded"] {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    /* Material Symbols Rounded - Filled variant for active states */
    .material-symbols-filled, .mat-icon[fontSet="material-symbols-filled"] {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-family: 'Material Symbols Rounded';
    }

    /* Default fill for navigation active states */
    .nav-link.active .material-symbols-rounded,
    .bottom-nav-item.active .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
    }
  </style>
  
  <!-- Google Maps is loaded dynamically by MapsService using environment.mapsApiKey -->
</head>
<body class="bg-surface text-on-surface">
  <app-root></app-root>
</body>
</html>
